<!doctype html>
<html lang="zh-CN" class="guard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0040FF">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="assets/guard.js"></script>
  <title>渠道专属活动</title>
  <link rel="icon" href="assets/bit-logo.png">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/hub.css">
</head>
<body>
  <div class="draft-banner" id="draftBanner" hidden>草稿预览 · 部分活动尚未审批，请勿对外发送本页</div>
  <main class="page">
    <header class="topbar">
      <img class="logo" src="assets/bit-logo.png" alt="BIT" width="40" height="40">
      <div class="topbar-text">
        <strong>渠道专属活动</strong>
        <span>客户经理专属推广 · 非官方页面</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">已开户客户专属 · 参与抽奖免费</p>
      <h1>挑一个活动，<span class="hl">开始参与</span></h1>
      <p class="lede">以下活动均为渠道专属推广活动，领取条件与发放以各活动页面说明及客户经理核验为准。</p>
    </section>

    <section class="list" id="list" aria-label="活动列表"></section>
    <p class="empty" id="empty" hidden>暂无进行中的活动，请联系你的专属客户经理。</p>

    <footer class="foot">
      <p>【渠道声明】本页为客户经理渠道专属推广页面，非 BIT 官方页面。各活动的参与条件、奖励与发放规则以各活动页面公示为准。</p>
      <p>【风险提示】投资有风险，入金及交易可能导致本金损失；请勿为获取奖励而入金，或超出自身风险承受能力入金。本页内容不构成投资建议或任何要约。</p>
    </footer>
  </main>

  <script src="activities.js"></script>
  <script src="assets/hub.js"></script>
</body>
</html>
